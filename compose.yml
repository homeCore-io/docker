# =============================================================================
# homeCore — the stack. Stable (`:latest`) track.
#
# Three containers:
#
#   homecore   hc-core — the REST/WebSocket API and the embedded MQTT broker.
#              No UI, no baked-in plugins.
#
#   app        hc-web-svelte — the web app, for the household and for running
#              the house: rooms, scenes, rules, plugins, people, backups. Its
#              Node server serves the app, passes /api/v1/* and the event
#              stream through to homecore on the same origin (core sends no
#              CORS headers), keeps sign-ins in httpOnly cookies, and stores
#              the app's own data — pages, layouts, displays — in /data.
#
#   hc-web     the Flutter web UI, kept for one thing: hand-built dashboard
#              pages, until the new app has its own (round three). Its nginx
#              reverse-proxies /api/v1/* to homecore the same way.
#
# Plugins are NOT containers. Install them from the UI (Plugins → Add) and core
# pulls a signed artifact from the plugin registry, verifies it, and runs it as
# a child process. Adding hardware support never means editing this file.
#
#   browser ─▶ app:3000    ─┬─ /           the web app
#                           └─ /api/v1/* ─▶ homecore:8080
#   browser ─▶ hc-web:3001 ─┬─ /           hand-built pages (Flutter)
#                           └─ /api/v1/* ─▶ homecore:8080
#
# Quick start:
#   mkdir homecore-data
#   docker compose up -d
#   cat homecore-data/INITIAL_ADMIN_PASSWORD     # first-boot admin creds
#   open http://<host-ip>:3000
#
# ── Which compose file? ──────────────────────────────────────────────────────
#
#   compose.yml        this file. Bridge networking. Start here.
#   compose.host.yml   host networking. Needed for DISCOVERY — Hue, Sonos, WLED
#                      and Roku find devices by multicast (mDNS/SSDP) and
#                      Ecowitt by UDP broadcast, neither of which a bridge
#                      network carries. If auto-discovery turns up nothing,
#                      that is the file you want.
#   compose-dev.yml    the `:dev` tag, built from develop on request.
#
# Plugins that reach out over ordinary TCP/HTTP (YoLink, Lutron, Caseta, ISY,
# Z-Wave) work fine on this bridge setup. Ecowitt can join them without
# switching files: set [ecowitt].gateway_ip and it polls the gateway over
# outbound HTTP instead of discovering it and being uploaded to.
#
# One host bind-mount per service. The entrypoint reads the mount's owner and
# drops privileges to match, so `mkdir homecore-data` as yourself is the whole
# setup — no UID env vars, no pre-chown.
# =============================================================================

services:
  homecore:
    image: ghcr.io/homecore-io/hc-core:latest
    container_name: homecore
    restart: unless-stopped
    pull_policy: always
    environment:
      RUST_LOG: info
    ports:
      # The API. Published so you can curl it directly; the app and hc-web
      # reach it over the compose network by service name either way.
      - "${HC_API_PORT:-8080}:8080"
      # The embedded MQTT broker is deliberately NOT published. It binds
      # loopback inside the container and core's plugins are children in the
      # same network namespace, so nothing outside needs it. Publish 1883 only
      # if LAN devices (Tasmota/Shelly/ESPHome) publish to it directly — and
      # then set [broker] host = "0.0.0.0" plus [[broker.clients]] credentials,
      # or core refuses to start rather than run an open broker.
    networks: [homecore]
    volumes:
      - ./homecore-data:/homecore
      # No config bind-mount. The image seeds its own default at
      # config/homecore.toml on first boot and it is correct as shipped —
      # core serves no UI, declares no plugins, and points at the signed
      # registry. Edit that file in homecore-data to customise; it is yours
      # after first boot and never overwritten.

  app:
    image: ghcr.io/homecore-io/hc-web-svelte:latest
    container_name: hc-web-svelte
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - homecore
    environment:
      # Where the app's server finds homeCore. `homecore` is the service name
      # above, so this resolves on the compose network.
      HC_CORE_URL: http://homecore:8080
    networks: [homecore]
    ports:
      - "${HC_WEB_PORT:-3000}:3000"
    volumes:
      # The app's own data: pages, people's Homes, displays, the house's look.
      # homeCore's backup doesn't hold it — Settings → Data & backups saves it.
      - app-data:/data

  hc-web:
    image: ghcr.io/homecore-io/hc-web:latest
    container_name: hc-web
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - homecore
    environment:
      # Where nginx sends /api/v1/*. `homecore` is the service name above, so
      # this resolves on the compose network.
      HOMECORE_URL: http://homecore:8080
    networks: [homecore]
    ports:
      - "${HC_PAGES_PORT:-3001}:80"

# Declared explicitly rather than left to the deployer's default.
#
# `docker compose up` creates a per-project network on its own and Docker's
# embedded DNS resolves service names on it, so this file worked without a
# networks block for anyone running compose directly. Deployed as a *stack*
# through a manager (Dockhand, Portainer, and anything else that hands the file
# to the engine differently) the containers can land on the default `bridge`
# network instead — and the default bridge has no name resolution at all.
#
# The failure is nasty because core is fine: it starts, it serves, and hc-web's
# nginx dies at config load with `host not found in upstream "homecore"`,
# restarts, and loops. Naming the network makes the stack behave the same
# wherever it is deployed from.
networks:
  homecore:
    driver: bridge

volumes:
  app-data:
