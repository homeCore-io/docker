# homeCore — seeded config for the compose stack.
#
# Mounted read-only into the hc-core container at
# /homecore/config/homecore.toml by every compose file here. A complete core
# config plus a [registry] block, so plugins install at runtime from the signed
# plugin registry through the web UI — Plugins → Add.
#
# [web_admin] is OFF on purpose: hc-web serves the UI in front of core and
# reverse-proxies /api/v1 to it, so core only needs to serve the API. Core no
# longer ships a UI bundle to serve either.
#
# Edit freely — it is your config. To start from the image's built-in default
# instead, drop the ./homecore.toml bind-mount from the compose file.

[server]
host = "0.0.0.0"
port = 8080

[broker]
# Embedded broker on loopback — plugins (core's children, same host netns)
# reach it at 127.0.0.1:1883. Set to "0.0.0.0" + add [[broker.clients]] to
# accept external MQTT publishes from LAN devices (Tasmota/Shelly/ESPHome).
host = "127.0.0.1"
port = 1883

[location]
# Set via the admin UI; sunrise/sunset rules stay off until these are real.
latitude  = 38.9072
longitude = -77.0369
timezone  = "America/New_York"

[battery]
threshold_pct    = 20.0
recover_band_pct = 5.0

[auth]
token_expiry_hours = 24
# First-boot admin password lands at /homecore/INITIAL_ADMIN_PASSWORD.

[storage]
# Defaults relative to the home dir: data/state.redb, data/history.db.

[rules]
# dir = "rules" (default)

[profiles]
# dir = "config/profiles" (default)

[web_admin]
# OFF — hc-web serves the UI and proxies /api to core. Nothing for core to serve.
enabled = false

[logging]
level = "info"

[logging.stderr]
enabled = true
format  = "pretty"
ansi    = true

[logging.file]
enabled          = true
prefix           = "homecore"
rotation         = "daily"
prune_after_days = 5
format           = "json"

# ---------------------------------------------------------------------------
# Plugin registry — install plugins at runtime from the UI (Plugins → Add).
# hc-core downloads a signed artifact from this registry, verifies it against
# public_key, and runs the plugin as a managed child. Point url at your own
# static host to self-host.
# ---------------------------------------------------------------------------
[registry]
# Both of these serve the same signed index; homecore.io is the friendly
# alias for the GitHub Pages original at
# https://homeCore-io.github.io/registry/index.json
url        = "https://homecore.io/registry/index.json"
public_key = "d64zXOo99GE+uYAPbtbIwLUJHtBaACJB73cUppj93I8="
