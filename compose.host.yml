# =============================================================================
# homeCore — the stack, on host networking.
#
# Same two containers as compose.yml. The difference is `network_mode: host`,
# and the reason is discovery.
#
# Hue, Sonos, WLED and Roku find devices with mDNS and SSDP — multicast, which
# a Docker bridge network does not forward. On compose.yml those plugins install
# and run, then find nothing. Ecowitt is the same story with UDP broadcast for
# discovery, plus a receiver on :8888 that compose.yml does not publish — set
# [ecowitt].gateway_ip to poll instead if you would rather stay on the bridge.
# Sonos additionally serves UPnP event callbacks and has to advertise an address
# the speakers can actually reach back on, which a NATed container IP is not.
#
# So: use this file if you have Hue, Sonos, WLED, Roku or Ecowitt, or if
# auto-discovery turned up empty on the bridge setup. Use compose.yml otherwise
# — it is the simpler thing and it isolates the containers properly.
#
# What host mode changes:
#   - No `ports:` mappings. Every listener lands straight on the host, so
#     hc-web takes WEB_PORT=3000 rather than being mapped there. HC_WEB_PORT
#     therefore changes what nginx *binds*, not what a mapping publishes.
#   - hc-web reaches core at 127.0.0.1 rather than by service name.
#   - The containers share the host's network namespace. Port conflicts are
#     real: if something else on this host owns 3000 or 8080, change the port
#     rather than expecting Docker to remap it.
#
# Why 127.0.0.1 and not `homecore`, which is what compose.yml uses:
#
# Docker's embedded DNS belongs to a user-defined network. `network_mode: host`
# puts the container in the host's network namespace instead, where there is no
# compose network and so no service-name resolution — but also no need for it,
# because core is literally on this host. So this is not the bridge file's DNS
# fix left unapplied; it is the same problem with a simpler answer.
#
# nginx still resolves its upstream at request time here (a variable in
# proxy_pass, per hc-web's Dockerfile), which is what keeps an unstarted core a
# 502 instead of a boot loop. A literal IP needs no lookup, and the image's
# resolver comes from /etc/resolv.conf, which in host mode is the host's own.
#
# Verified against the published :latest image on 2026-07-31: nginx starts,
# serves the app, and /api/v1/health returns core's JSON through the proxy.
#
# Quick start:
#   mkdir homecore-data
#   docker compose -f compose.host.yml up -d
#   cat homecore-data/INITIAL_ADMIN_PASSWORD
#   open http://<host-ip>:3000
#
# Linux only. Docker Desktop on macOS and Windows runs containers in a VM, so
# `network_mode: host` does not give access to the LAN's multicast traffic and
# this file will not do what it is for.
# =============================================================================

services:
  homecore:
    image: ghcr.io/homecore-io/hc-core:latest
    container_name: homecore
    restart: unless-stopped
    pull_policy: always
    network_mode: host
    environment:
      RUST_LOG: info
    volumes:
      - ./homecore-data:/homecore
      # No config bind-mount. The image seeds its own default at
      # config/homecore.toml on first boot and it is correct as shipped —
      # core serves no UI, declares no plugins, and points at the signed
      # registry. Edit that file in homecore-data to customise; it is yours
      # after first boot and never overwritten.

  hc-web:
    image: ghcr.io/homecore-io/hc-web:latest
    container_name: hc-web
    restart: unless-stopped
    pull_policy: always
    network_mode: host
    depends_on:
      - homecore
    environment:
      # Core is simply on this host — see the header for why this is an address
      # and not the `homecore` service name.
      #
      # HC_API_PORT means something different here than in compose.yml. There it
      # is the published side of a mapping and core stays on 8080 inside its
      # container. In host mode there is no mapping: core binds whatever its
      # [server] port says, so this only tells nginx where to look and must be
      # set to match. It was hardcoded to 8080 while the header told you to
      # change [server] port on a conflict — follow that and nginx kept
      # proxying to a port core had left.
      HOMECORE_URL: http://127.0.0.1:${HC_API_PORT:-8080}
      # nginx listens here directly. With no port mapping to remap, the
      # container cannot sit on 80 without owning the host's port 80.
      WEB_PORT: ${HC_WEB_PORT:-3000}
