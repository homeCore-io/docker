# homeCore — new (Flutter) web UI + core, plugins from the registry
#
# Two containers:
#   homecore  — hc-core: the API + embedded MQTT broker. No UI, no baked plugins.
#   hc-web    — the new Flutter web UI; nginx serves it and reverse-proxies
#               /api/v1/* (incl. WebSocket/SSE) to core.
#
# Plugins are NOT bundled — install them from the UI (Plugins → Add), which
# pulls signed artifacts from the plugin registry (configured in homecore.toml).
#
# Quick start:
#   mkdir homecore-data
#   docker compose up -d
#   cat homecore-data/INITIAL_ADMIN_PASSWORD      # first-boot admin creds
#   open http://<host-ip>:3000                    # the new UI
#   In the UI: Plugins → Add → install what you want to test.
#
# Networking: this uses a normal bridge network (hc-web reaches core by its
# service name). That's the simplest to run. NOTE: mDNS/SSDP-based plugin
# discovery (WLED/Hue/Sonos auto-find) needs the broker/plugins on the host
# network — for that, add `network_mode: host` to the homecore service (and
# drop its `ports:`), then set hc-web's HOMECORE_URL to the host IP.

services:
  homecore:
    image: ghcr.io/homecore-io/hc-core:dev
    container_name: homecore
    restart: unless-stopped
    pull_policy: always
    environment:
      RUST_LOG: info
    ports:
      - "8080:8080"        # API (also used by hc-web over the compose network)
    volumes:
      - ./homecore-data:/homecore
      # Our config: adds the [registry] block and turns core's own web UI off
      # (hc-web serves the UI). Overrides the image's first-boot default.
      - ./homecore.toml:/homecore/config/homecore.toml:ro

  hc-web:
    image: ghcr.io/homecore-io/hc-web:dev
    container_name: hc-web
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - homecore
    environment:
      # nginx in this image reverse-proxies /api/v1/* here. Same compose
      # network, so the `homecore` service name resolves.
      HOMECORE_URL: http://homecore:8080
    ports:
      - "3000:80"          # the new UI → http://<host-ip>:3000
