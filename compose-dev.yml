# =============================================================================
# homeCore — the stack, develop-branch builds (`:dev`).
#
# Same shape as compose.yml, pinned to the `:dev` tag that every push to
# develop retags. Use it to run pre-release builds against real hardware.
#
# Names and data directories carry a `-dev` suffix so a dev stack can sit
# alongside a stable one — but you must also change the published ports below,
# since two stacks cannot both claim 3000 and 8080.
#
# Quick start:
#   mkdir homecore-data-dev
#   docker compose -f compose-dev.yml up -d
#   cat homecore-data-dev/INITIAL_ADMIN_PASSWORD
#   open http://<host-ip>:3000
#
# For discovery (Hue/Sonos/WLED/Roku) see compose.host.yml — swap its images
# to `:dev` for the same effect on this track.
# =============================================================================

services:
  homecore-dev:
    image: ghcr.io/homecore-io/hc-core:dev
    container_name: homecore-dev
    restart: unless-stopped
    # `:dev` is mutable — every develop push retags it. Always pull on `up`
    # or you keep running whatever was cached locally.
    pull_policy: always
    environment:
      RUST_LOG: debug
    ports:
      - "8080:8080"
    networks: [homecore-dev]
    volumes:
      - ./homecore-data-dev:/homecore
      - ./homecore.toml:/homecore/config/homecore.toml:ro

  hc-web-dev:
    image: ghcr.io/homecore-io/hc-web:dev
    container_name: hc-web-dev
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - homecore-dev
    environment:
      HOMECORE_URL: http://homecore-dev:8080
    networks: [homecore-dev]
    ports:
      - "3000:3001"

# Named for the same reason as compose.yml: a stack deployer may not create a
# per-project network, and the default bridge has no name resolution, so
# hc-web's nginx cannot resolve `homecore-dev` and crash-loops.
networks:
  homecore-dev:
    driver: bridge
