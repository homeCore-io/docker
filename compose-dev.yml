# =============================================================================
# homeCore — the stack, develop-branch builds (`:dev`).
#
# Same shape as compose.yml, pinned to the `:dev` tag. Use it to run
# pre-release builds against real hardware.
#
# **That tag is built on request, not on every push** — as of 2026-08-12 both
# core and hc-web publish it from a manual run (`gh workflow run release.yml
# --ref develop`, or the Actions tab) rather than from every commit to develop.
# So `:dev` is as fresh as the last time someone asked for it: build it before
# you pull if you are chasing something specific.
#
# Names and data directories carry a `-dev` suffix so a dev stack can sit
# alongside a stable one — but you must also change the published ports below,
# since two stacks cannot both claim 3000 and 8080.
#
# Quick start:
#   mkdir homecore-data-dev
#   docker compose -f compose-dev.yml up -d
#   cat homecore-data-dev/INITIAL_ADMIN_PASSWORD
#   open http://<host-ip>:3000
#
# For discovery (Hue/Sonos/WLED/Roku) see compose.host.yml — swap its images
# to `:dev` for the same effect on this track.
# =============================================================================

services:
  homecore-dev:
    image: ghcr.io/homecore-io/hc-core:dev
    container_name: homecore-dev
    restart: unless-stopped
    # `:dev` is mutable — each build of it retags. Always pull on `up` or you
    # keep running whatever was cached locally.
    pull_policy: always
    environment:
      RUST_LOG: debug
    ports:
      - "${HC_API_PORT:-8080}:8080"
    networks: [homecore-dev]
    volumes:
      - ./homecore-data-dev:/homecore
      # No config bind-mount. The image seeds its own default at
      # config/homecore.toml on first boot and it is correct as shipped —
      # core serves no UI, declares no plugins, and points at the signed
      # registry. Edit that file in homecore-data to customise; it is yours
      # after first boot and never overwritten.

  hc-web-dev:
    image: ghcr.io/homecore-io/hc-web:dev
    container_name: hc-web-dev
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - homecore-dev
    environment:
      HOMECORE_URL: http://homecore-dev:8080
    networks: [homecore-dev]
    ports:
      - "${HC_WEB_PORT:-3000}:80"

# Named for the same reason as compose.yml: a stack deployer may not create a
# per-project network, and the default bridge has no name resolution, so
# hc-web's nginx cannot resolve `homecore-dev` and crash-loops.
networks:
  homecore-dev:
    driver: bridge
